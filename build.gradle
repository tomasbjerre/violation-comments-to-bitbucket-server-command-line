plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "2.2.0"
}

dependencies {
	implementation "se.bjurr.violations:violation-comments-to-bitbucket-server-lib:3.0.0"
	implementation "se.bjurr.violations:violations-lib:2.1.0"
	implementation 'info.picocli:picocli:4.7.7'
	implementation "org.slf4j:slf4j-simple:2.0.19"
}

shadowExtension {
	mainClass.set("se.bjurr.violations.main.Main")
	relocate.set("org:org,com:com")
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}

javaExtension {
	javaVersion = 17
}

if (System.getenv("CI")) {
	// A literal env var name containing a dot ("signing.password") does not
	// survive the GitHub Actions -> bash -> JVM chain, so use a dot-free name
	// in CI only. Local releases keep using "signing.password" via gradle.properties.
	signExtension {
		signingPasswordEnvOrProp.set("SIGNING_PASSWORD")
	}
}
