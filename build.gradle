plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "2.1.1"
}

dependencies {
	implementation 'se.bjurr.violations:violation-comments-to-bitbucket-server-lib:2.0.1'
	implementation "se.bjurr.violations:violations-lib:2.0.2"
	implementation 'se.softhouse:jargo:0.4.14'
	implementation "org.slf4j:slf4j-simple:2.0.19"
}

shadowExtension {
	mainClass.set("se.bjurr.violations.main.Main")
	relocate.set("org:org,com:com")
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}

javaExtension {
	javaVersion = 17
}
